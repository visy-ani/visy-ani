<text class="jb" x="96" y="84" font-size="11" letter-spacing="2" fill="#858D88">01 // FEHU · START WHERE NO PATTERN EXISTS</text>
<text class="sg" x="94" y="118" font-size="38" font-weight="700" fill="#E8ECE7" letter-spacing="-1">DESIGN THE <tspan class="cg" font-size="44" font-weight="600" fill="#B6F36A">unknown.</tspan></text>
<text class="rn" x="40" y="212" font-size="36" fill="#D5AE62">ᛉ</text>
<text class="jb" x="96" y="180" font-size="11" letter-spacing="2" fill="#858D88">02 // ALGIZ · AGENTS WITHOUT CONTEXT ARE GUESSING</text>
<text class="sg" x="94" y="214" font-size="38" font-weight="700" fill="#E8ECE7" letter-spacing="-1">MEMORY IS <tspan fill="#B6F36A">INFRASTRUCTURE.</tspan></text>
<text class="rn" x="40" y="308" font-size="36" fill="#D5AE62">ᚦ</text>
<text class="jb" x="96" y="276" font-size="11" letter-spacing="2" fill="#858D88">03 // THURISAZ · EVERY SYSTEM BREAKS. BREAK GENTLY</text>
<text class="sg" x="94" y="310" font-size="38" font-weight="700" fill="#E8ECE7" letter-spacing="-1">FAIL GENTLY. <tspan fill="#B6F36A">SCALE QUIETLY.</tspan></text>
<text class="rn" x="40" y="404" font-size="36" fill="#D5AE62">ᛟ</text>
<text class="jb" x="96" y="372" font-size="11" letter-spacing="2" fill="#858D88">04 // OTHALA · INHERIT NOTHING. INVENT THE REST</text>
<text class="sg" x="94" y="406" font-size="38" font-weight="700" fill="#E8ECE7" letter-spacing="-1">BUILD THE <tspan class="cg" font-size="44" font-weight="600" fill="#B6F36A">impossible.</tspan></text>
